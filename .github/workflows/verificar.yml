name: Conferir conversão das leis

# Baixa as leis do Planalto, converte e gera um relatório de conferência
# (sem publicar nada e sem alterar o repositório).
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/**', 'leis.json', '.github/workflows/verificar.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Baixar leis do Planalto
        continue-on-error: true
        run: node scripts/atualizar-leis.mjs --salvar-fontes
      - name: Relatório
        run: |
          node scripts/verificar.mjs > relatorio.md
          cat relatorio.md >> "$GITHUB_STEP_SUMMARY"
          cat relatorio.md
      - name: Diagnóstico de trechos do HTML original
        run: node scripts/diagnostico.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: conferencia
          path: |
            relatorio.md
            data/
            fontes/
